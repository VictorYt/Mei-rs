<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>
<text x="165" y="34.7" font-size="26" fill="#1e1e1e" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="165" dy="0">Detail 3: assembly, genotype, score and output (phases 4 and 5)</tspan></text>
<rect x="20" y="55" width="1160" height="330" rx="12" fill="#c3fae8" fill-opacity="0.4" stroke="#06b6d4" stroke-width="1"/>
<text x="35" y="81.0" font-size="20" fill="#0e7490" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="35" dy="0">Phase 4: local assembly (needs --reference)</tspan></text>
<rect x="40" y="105" width="350" height="120" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#06b6d4" stroke-width="2"/>
<text x="215.0" y="140.2" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="215.0" dy="0">Gather the reads</tspan><tspan x="215.0" dy="20.0">clipped within 5 bp of each</tspan><tspan x="215.0" dy="20.0">junction + unmapped reads</tspan><tspan x="215.0" dy="20.0">placed near the site</tspan></text>
<line x1="390" y1="165" x2="430" y2="165" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="430" y="105" width="350" height="120" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#06b6d4" stroke-width="2"/>
<text x="605.0" y="150.2" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="605.0" dy="0">de Bruijn graph, k = 21</tspan><tspan x="605.0" dy="20.0">seeded from the reference flank;</tspan><tspan x="605.0" dy="20.0">extended into the inserted bases</tspan></text>
<line x1="780" y1="165" x2="820" y2="165" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="820" y="105" width="340" height="120" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#06b6d4" stroke-width="2"/>
<text x="990.0" y="150.2" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="990.0" dy="0">Compare the contig with</tspan><tspan x="990.0" dy="20.0">the flank: where it leaves</tspan><tspan x="990.0" dy="20.0">the reference = the junction</tspan></text>
<line x1="990" y1="225" x2="990" y2="255" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="40" y="260" width="1120" height="105" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="600.0" y="297.7" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="600.0" dy="0">Both junctions: TSD = the reference between them (1 to 50 bp). Poly(A) tail = pure run at the inserted end.</tspan><tspan x="600.0" dy="20.0">Without clip junctions (mates only): the breakpoint is tried as left and as right junction; the side kept</tspan><tspan x="600.0" dy="20.0">has a poly(A/T) tail or an inserted sequence of the right family. An assembled junction drops IMPRECISE.</tspan></text>
<line x1="600" y1="385" x2="600" y2="415" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="20" y="420" width="1160" height="330" rx="12" fill="#d3f9d8" fill-opacity="0.4" stroke="#22c55e" stroke-width="1"/>
<text x="35" y="446.0" font-size="20" fill="#15803d" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="35" dy="0">Phase 5: genotype, score, confidence</tspan></text>
<rect x="40" y="470" width="350" height="260" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="215.0" y="515.2" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="215.0" dy="0">Genotype</tspan><tspan x="215.0" dy="20.0">&#160;</tspan><tspan x="215.0" dy="20.0">alt reads: clipped at a junction</tspan><tspan x="215.0" dy="20.0">(+/- 5 bp, 15 good bases)</tspan><tspan x="215.0" dy="20.0">ref reads: aligned over the site</tspan><tspan x="215.0" dy="20.0">&#160;</tspan><tspan x="215.0" dy="20.0">binomial likelihood,</tspan><tspan x="215.0" dy="20.0">heterozygous at 30% alt</tspan><tspan x="215.0" dy="20.0">&#160;</tspan><tspan x="215.0" dy="20.0">0/0 (noise), 0/1, 1/1</tspan></text>
<rect x="410" y="470" width="370" height="260" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="595.0" y="525.2" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="595.0" dy="0">QUAL score (naive Bayes)</tspan><tspan x="595.0" dy="20.0">&#160;</tspan><tspan x="595.0" dy="20.0">tail, signals on both sides, TSD,</tspan><tspan x="595.0" dy="20.0">high typing identity, distinct fragment</tspan><tspan x="595.0" dy="20.0">starts (PCR duplicates), MEI mates,</tspan><tspan x="595.0" dy="20.0">signal / depth ratio</tspan><tspan x="595.0" dy="20.0">&#160;</tspan><tspan x="595.0" dy="20.0">weights fit on HGSVC3 PASS calls;</tspan><tspan x="595.0" dy="20.0">low_qual below --min-qual</tspan></text>
<rect x="800" y="470" width="360" height="260" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="980.0" y="525.2" font-size="16" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="980.0" dy="0">Confidence of a PASS call</tspan><tspan x="980.0" dy="20.0">&#160;</tspan><tspan x="980.0" dy="20.0">high: tail + TSD</tspan><tspan x="980.0" dy="20.0">medium: tail</tspan><tspan x="980.0" dy="20.0">low: no tail, or typed by</tspan><tspan x="980.0" dy="20.0">the mates only</tspan><tspan x="980.0" dy="20.0">&#160;</tspan><tspan x="980.0" dy="20.0">FILTER = PASS or the</tspan><tspan x="980.0" dy="20.0">filter names (snake_case)</tspan></text>
<line x1="600" y1="750" x2="600" y2="780" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="20" y="785" width="1160" height="95" rx="12" fill="#d3f9d8" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="600.0" y="827.1" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="600.0" dy="0">VCF 4.2: ALT &lt;INS:ME:ALU|LINE1|SVA&gt;, SVTYPE=INS, MEINFO, TSD, CIPOS / IMPRECISE,</tspan><tspan x="600.0" dy="22.5">GT:GQ:AD:DP, QUAL; bgzip + tabix when the output ends with .gz</tspan></text>
</svg>
<line x1="225" y1="150" x2="225" y2="180" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="60" y="185" width="330" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-width="2"/>
<text x="225.0" y="224.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="225.0" dy="0">1. Reader</tspan><tspan x="225.0" dy="25.0">signal extraction</tspan></text>
<text x="420" y="217.1" font-size="18" fill="#374151" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="420" dy="0">Reads only the probes + padding: soft-clips,</tspan><tspan x="420" dy="22.5">discordant pairs, unmapped reads with an anchored mate</tspan></text>
<line x1="225" y1="275" x2="225" y2="305" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<text x="240" y="295.2" font-size="16" fill="#757575" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="240" dy="0">signals</tspan></text>
<rect x="60" y="310" width="330" height="90" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-width="2"/>
<text x="225.0" y="349.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="225.0" dy="0">2. Cluster</tspan><tspan x="225.0" dy="25.0">candidate sites</tspan></text>
<text x="420" y="342.1" font-size="18" fill="#374151" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="420" dy="0">Groups signals into sites, finds the breakpoint, flags</tspan><tspan x="420" dy="22.5">capture artefacts (probe edge, low signal / depth ratio)</tspan></text>
<line x1="225" y1="400" x2="225" y2="430" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<text x="240" y="420.2" font-size="16" fill="#757575" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="240" dy="0">candidates</tspan></text>
<rect x="60" y="435" width="330" height="90" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-width="2"/>
<text x="225.0" y="474.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="225.0" dy="0">3. Typer</tspan><tspan x="225.0" dy="25.0">which element?</tspan></text>
<text x="420" y="467.1" font-size="18" fill="#374151" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="420" dy="0">Aligns the clips and the mates to the Alu / LINE-1 / SVA</tspan><tspan x="420" dy="22.5">consensus: family, subfamily, strand</tspan></text>

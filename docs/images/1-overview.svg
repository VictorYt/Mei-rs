<text x="240" y="545.2" font-size="16" fill="#757575" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="240" dy="0">typed candidates</tspan></text>
<rect x="60" y="560" width="330" height="90" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#06b6d4" stroke-width="2"/>
<text x="225.0" y="599.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="225.0" dy="0">4. Assembly</tspan><tspan x="225.0" dy="25.0">exact junctions</tspan></text>
<text x="420" y="592.1" font-size="18" fill="#374151" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="420" dy="0">Local de Bruijn assembly from the reference flank:</tspan><tspan x="420" dy="22.5">base-level junctions, TSD, poly(A) tail</tspan></text>
<line x1="225" y1="650" x2="225" y2="680" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<text x="240" y="670.2" font-size="16" fill="#757575" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="240" dy="0">contigs, TSD, tail</tspan></text>
<rect x="60" y="685" width="330" height="90" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="225.0" y="724.0" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="225.0" dy="0">5. Genotype + filters</tspan><tspan x="225.0" dy="25.0">score and output</tspan></text>
<text x="420" y="717.1" font-size="18" fill="#374151" text-anchor="start" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="420" dy="0">Genotype (0/1, 1/1), QUAL score, PASS / filter names,</tspan><tspan x="420" dy="22.5">confidence high / medium / low</tspan></text>
<line x1="225" y1="775" x2="225" y2="810" stroke="#1e1e1e" stroke-width="2" marker-end="url(#h)"/>
<rect x="60" y="815" width="1100" height="60" rx="12" fill="#d3f9d8" fill-opacity="1.0" stroke="#22c55e" stroke-width="2"/>
<text x="610.0" y="851.5" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal"><tspan x="610.0" dy="0">Output: VCF 4.2 (.vcf.gz + .tbi), or TSV / BED / JSON for debugging</tspan></text>

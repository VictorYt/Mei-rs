[package]
name = "mei-rs"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
description = "Fast, memory-efficient detection of mobile element insertions (Alu, LINE-1, SVA) in targeted capture and exome sequencing data"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/VictorYt/Mei-rs"
keywords = ["bioinformatics", "genomics", "sequencing", "transposable-elements"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "mei-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
coitrees = "0.4"
flate2 = "1"
noodles = { version = "0.117", features = ["bam", "cram", "sam", "fasta", "core", "csi", "bgzf"] }
noodles-util = { version = "0.86", features = ["alignment"] }
rayon = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
